<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <meta name="description" content="Universal Wisdom School - Grade 2 Hindi Summative Assessment 1 (SA-1) Exam Prep App">
  <title>Hindi SA-1 Prep App | Universal Wisdom School Grade 2</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
</head>
<body>

  <!-- Mobile Shell Frame Container -->
  <div id="app-container">

    <!-- Canvas Confetti Overlay -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Top Sticky Bar -->
    <header class="top-bar">
      <div class="stat-chip streak" title="Daily Streak">
        <span>🔥</span>
        <span id="streak-count">1</span>
      </div>

      <div class="stat-chip gems" title="XP Points">
        <span>💎</span>
        <span id="gems-count">0</span>
      </div>

      <div class="stat-chip hearts" id="hearts-stat-chip" title="Hearts / Lives (Tap to refill)">
        <span>❤️</span>
        <span id="hearts-count">5</span>
      </div>

      <div class="stat-chip sound" id="sound-toggle-btn" title="Toggle Sound & Speech">
        <span>🔊</span>
        <span class="sound-label" style="font-size: 11px;">Sound</span>
      </div>

      <div class="stat-chip settings" id="settings-toggle-btn" title="Settings">
        <span>⚙️</span>
      </div>
    </header>

    <!-- Subject Switcher Segmented Bar -->
    <div class="subject-bar">
      <div class="subject-toggle-group">
        <button class="subject-tab-btn active" id="sub-btn-hindi" onclick="switchSubject('hindi')">
          <span class="sub-flag">🇮🇳</span>
          <span class="sub-title">Hindi (हिंदी)</span>
          <span class="sub-badge" id="hindi-sub-badge">30 M</span>
        </button>
        <button class="subject-tab-btn" id="sub-btn-computing" onclick="switchSubject('computing')">
          <span class="sub-flag">💻</span>
          <span class="sub-title">Computing</span>
          <span class="sub-badge" id="computing-sub-badge">20 M</span>
        </button>
      </div>
    </div>

    <!-- Main Scrollable Screen Viewport -->
    <main class="screen-viewport">

      <!-- ================= 1. LEARN VIEW (Duolingo Path) ================= -->
      <section id="learn-view" class="view-section active">
        <!-- Mascot Speech Banner -->
        <div class="mascot-row">
          <div class="mascot-avatar" id="mascot-avatar-display">🦉</div>
          <div class="speech-bubble" id="mascot-speech-bubble">
            Hello! Let's prepare for your <strong>Hindi SA-1 Exam</strong> using your textbook <strong>'Bal Patwar 2'</strong>! ✨
          </div>
        </div>

        <!-- Dynamic Adventure Path -->
        <div id="path-nodes-container"></div>
      </section>

      <!-- ================= 2. MODES HUB VIEW ================= -->
      <section id="modes-view" class="view-section">
        <div id="modes-view-container"></div>
      </section>

      <!-- ================= 3. SA-1 EXAM VIEW ================= -->
      <section id="exam-view" class="view-section">
        <div id="exam-view-container"></div>
      </section>

      <!-- ================= 4. REPORT CARD VIEW ================= -->
      <section id="report-view" class="view-section">
        <div id="report-view-container"></div>
      </section>

    </main>

    <!-- Bottom Navigation Bar (Duolingo Style) -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-target="learn-view">
        <span class="tab-icon">🗺️</span>
        <span>Learn</span>
      </button>

      <button class="nav-tab" data-target="modes-view">
        <span class="tab-icon">🎮</span>
        <span>Modes</span>
      </button>

      <button class="nav-tab" data-target="exam-view">
        <span class="tab-icon">📝</span>
        <span>Exam</span>
      </button>

      <button class="nav-tab" data-target="report-view">
        <span class="tab-icon">🏆</span>
        <span>Report</span>
      </button>
    </nav>

    <!-- Active Game Modal Overlay -->
    <div id="game-modal">
      <div class="game-header">
        <button class="close-game-btn" id="close-game-btn">✕</button>
        <div class="game-progress-bar">
          <div class="game-progress-fill" id="game-progress-bar-fill"></div>
        </div>
        <div class="game-hearts-display">
          <span>❤️</span>
          <span id="modal-hearts-count">5</span>
        </div>
      </div>

      <!-- Question Content Area -->
      <div class="game-content-area" id="game-content-area"></div>

      <!-- Bottom Action Tray -->
      <div class="game-bottom-action">
        <div id="feedback-banner" class="feedback-banner"></div>
        <button class="btn-duo btn-green" id="check-answer-btn" disabled>
          CHECK
        </button>
      </div>
    </div>

    <!-- Settings Modal Overlay -->
    <div id="settings-modal" class="modal-overlay">
      <div class="settings-sheet">
        <div class="settings-header">
          <h3>⚙️ Settings</h3>
          <button class="close-modal-btn" id="close-settings-btn">✕</button>
        </div>
        <div class="settings-content">
          <div class="setting-row">
            <div>
              <strong>Sound Effects & Audio</strong>
              <small style="display:block; color: var(--text-secondary);">Pronunciations and chimes</small>
            </div>
            <button class="btn-duo btn-white" id="settings-sound-btn" style="width: auto; padding: 8px 16px; font-size: 13px;">
              Sound: ON
            </button>
          </div>
          <div class="setting-row">
            <div>
              <strong>Refill Hearts</strong>
              <small style="display:block; color: var(--text-secondary);">Restore all 5 lives</small>
            </div>
            <button class="btn-duo btn-white" id="settings-refill-btn" style="width: auto; padding: 8px 16px; font-size: 13px;">
              💖 Refill 5 Hearts
            </button>
          </div>
          <hr style="border: 0; border-top: 1px dashed var(--duo-gray-dark); margin: 14px 0;">
          <div class="setting-row">
            <div>
              <strong style="color: var(--duo-red-dark);">Reset All Progress</strong>
              <small style="display:block; color: var(--text-secondary);">Clear all stars, XP and exam score</small>
            </div>
            <button class="btn-duo btn-red" id="reset-progress-btn" style="width: auto; padding: 10px 16px; font-size: 13px;">
              🗑️ Reset
            </button>
          </div>
        </div>
      </div>
    </div>

  </div> <!-- /#app-container -->

  <!-- Scripts -->
  <script src="js/illustrations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/computingData.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
